<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seynabs Lampe</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background-color: var(--card-bg);
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            text-align: center;
            width: 100%;
            max-width: 400px;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 1.5rem;
            letter-spacing: 0.5px;
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
        }

        button {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 0.8rem 1.5rem;
            font-size: 1rem;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s;
            width: 100%;
            font-weight: 600;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        .control-group {
            margin-top: 1.5rem;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        input[type="range"], input[type="color"] {
            width: 100%;
            cursor: pointer;
            margin-bottom: 1rem;
        }

        input[type="color"] {
            border: none;
            height: 40px;
            border-radius: 8px;
            background: none;
        }

        #status {
            margin-top: 1rem;
            font-size: 0.85rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Seynabs Lampe</h1>

        <!-- Bildschirm 1: Verbindung -->
        <div id="connect-screen" class="screen active">
            <p style="color: var(--text-muted); margin-bottom: 1.5rem;">Verbinde dein Gerät mit der Lampe, um sie zu steuern.</p>
            <button id="connect-btn">Mit Lampe verbinden</button>
            <div id="status">Nicht verbunden</div>
        </div>

        <!-- Bildschirm 2: Bedienung -->
        <div id="control-screen" class="screen">
            <div class="control-group">
                <label for="colorPicker">Farbe wählen (RGB)</label>
                <input type="color" id="colorPicker" value="#ffffff">
            </div>

            <div class="control-group">
                <label for="brightnessSlider">Helligkeit dimmen</label>
                <input type="range" id="brightnessSlider" min="0" max="255" value="100">
            </div>

            <button id="disconnect-btn" style="background-color: #ef4444; margin-top: 1rem;">Verbindung trennen</button>
        </div>
    </div>

    <script>
        const SERVICE_UUID = "12345678-1234-1234-1234-1234567890ab";
        const CHARACTERISTIC_UUID = "87654321-4321-4321-4321-ba0987654321";

        let bluetoothDevice;
        let bluetoothCharacteristic;
        let rssiInterval;

        const connectScreen = document.getElementById('connect-screen');
        const controlScreen = document.getElementById('control-screen');
        const connectBtn = document.getElementById('connect-btn');
        const disconnectBtn = document.getElementById('disconnect-btn');
        const statusDiv = document.getElementById('status');
        const colorPicker = document.getElementById('colorPicker');
        const brightnessSlider = document.getElementById('brightnessSlider');

        connectBtn.addEventListener('click', connectBLE);
        disconnectBtn.addEventListener('click', disconnectBLE);

        async function connectBLE() {
            try {
                statusDiv.innerText = "Suche nach Lampe...";
                bluetoothDevice = await navigator.bluetooth.requestDevice({
                    filters: [{ name: 'Seynabs Lampe' }],
                    optionalServices: [SERVICE_UUID]
                });

                bluetoothDevice.addEventListener('gattserverdisconnected', onDisconnected);

                statusDiv.innerText = "Verbinde mit GATT...";
                const server = await bluetoothDevice.gatt.connect();

                statusDiv.innerText = "Lade Service...";
                const service = await server.getPrimaryService(SERVICE_UUID);

                statusDiv.innerText = "Lade Charakteristik...";
                bluetoothCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);

                // Wechsel zum Bedienungs-Bildschirm
                connectScreen.classList.remove('active');
                controlScreen.classList.add('active');

                // RSSI Überwachung starten (Signalstärke prüfen)
                startRssiMonitoring();

            } catch (error) {
                console.error("Fehler bei der Verbindung:", error);
                statusDiv.innerText = "Verbindung fehlgeschlagen.";
            }
        }

        // Farbe senden
        colorPicker.addEventListener('input', (e) => {
            const hex = e.target.value;
            const r = parseInt(hex.substring(1, 3), 16);
            const g = parseInt(hex.substring(3, 5), 16);
            const b = parseInt(hex.substring(5, 7), 16);
            sendData(`R:${r},G:${g},B:${b}`);
        });

        // Helligkeit senden
        brightnessSlider.addEventListener('input', (e) => {
            const val = e.target.value;
            sendData(`BR:${val}`);
        });

        async function sendData(data) {
            if (bluetoothCharacteristic && bluetoothDevice && bluetoothDevice.gatt.connected) {
                const encoder = new TextEncoder();
                try {
                    await bluetoothCharacteristic.writeValue(encoder.encode(data));
                } catch (error) {
                    console.error("Fehler beim Senden:", error);
                }
            }
        }

        function startRssiMonitoring() {
            // Regelmäßige RSSI Abfrage (Browser unterstützen watchAdvertisements oder remoteRSSI je nach API)
            rssiInterval = setInterval(async () => {
                if (bluetoothDevice && bluetoothDevice.gatt.connected) {
                    try {
                        // Hinweis: Web Bluetooth Standard hat aktuell limitierte direkte RSSI-Abfragen im verbundenen Zustand, 
                        // weshalb man oft auf Signal-Events setzt. Alternativ bricht der ESP32 die Verbindung ab.
                    } catch (err) {
                        console.error("RSSI Fehler", err);
                    }
                }
            }, 3000);
        }

        function disconnectBLE() {
            if (bluetoothDevice && bluetoothDevice.gatt.connected) {
                bluetoothDevice.gatt.disconnect();
            }
        }

        function onDisconnected() {
            clearInterval(rssiInterval);
            controlScreen.classList.remove('active');
            connectScreen.classList.add('active');
            statusDiv.innerText = "Verbindung getrennt (oder RSSI zu schwach).";
        }
    </script>
</body>
</html>
