<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 RGB Lampensteuerung</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #121212;
            color: #ffffff;
            margin-top: 50px;
        }
        button {
            padding: 12px 24px;
            font-size: 16px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 20px;
        }
        button:hover {
            background-color: #0056b3;
        }
        #status {
            margin: 15px;
            font-weight: bold;
            color: #ffcc00;
        }
        .control-container {
            margin-top: 30px;
        }
        input[type="color"] {
            width: 150px;
            height: 150px;
            border: none;
            cursor: pointer;
            background: none;
        }
    </style>
</head>
<body>

    <h1>ESP32 Bluetooth Lampe</h1>
    <button id="connectBtn">Mit Lampe verbinden</button>
    <div id="status">Status: Getrennt</div>

    <div class="control-container">
        <label for="colorPicker">Wähle eine Farbe:</label><br><br>
        <input type="color" id="colorPicker" value="#ff0000">
    </div>

    <script>
        const serviceUuid = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
        const characteristicUuid = "beb5483e-36e1-4688-b7f5-ea07361b26a1";

        let bluetoothDevice;
        let bluetoothCharacteristic;

        const connectBtn = document.getElementById('connectBtn');
        const statusDiv = document.getElementById('status');
        const colorPicker = document.getElementById('colorPicker');

        connectBtn.addEventListener('click', async () => {
            try {
                statusDiv.innerText = "Status: Suche nach ESP32...";
                
                // Verbindung zum BLE-Gerät anfordern
                bluetoothDevice = await navigator.bluetooth.requestDevice({
                    filters: [{ name: 'ESP32_RGB_Lampe' }],
                    optionalServices: [serviceUuid]
                });

                statusDiv.innerText = "Status: Verbinde mit Server...";
                const server = await bluetoothDevice.gatt.connect();

                statusDiv.innerText = "Status: Lade Service...";
                const service = await server.getPrimaryService(serviceUuid);

                statusDiv.innerText = "Status: Lade Characteristic...";
                bluetoothCharacteristic = await service.getCharacteristic(characteristicUuid);

                statusDiv.innerText = "Status: Verbunden! 🟢";
                connectBtn.innerText = "Verbunden";
                connectBtn.style.backgroundColor = "#28a745";

            } catch (error) {
                console.error(error);
                statusDiv.innerText = "Status: Fehler bei der Verbindung!";
            }
        });

        // Funktion zum Senden der RGB-Werte an den ESP32
        async function sendColor(r, g, b) {
            if (!bluetoothCharacteristic) return;

            // Daten als UInt8Array (3 Bytes: R, G, B) verpacken
            const data = new Uint8Array([r, g, b]);
            try {
                await bluetoothCharacteristic.writeValue(data);
            } catch (error) {
                console.error("Fehler beim Senden der Farbe:", error);
            }
        }

        // Wenn der Nutzer den Farbwähler ändert
        colorPicker.addEventListener('input', (event) => {
            const hex = event.target.value;
            // HEX-Farbcode in R, G, B umwandeln
            const r = parseInt(hex.slice(1, 3), 16);
            const g = parseInt(hex.slice(3, 5), 16);
            const b = parseInt(hex.slice(5, 7), 16);

            sendColor(r, g, b);
        });
    </script>
</body>
</html>
