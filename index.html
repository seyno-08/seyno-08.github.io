<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 RGB Lampe Steuerung</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.4);
            text-align: center;
            width: 320px;
        }
        h2 {
            margin-top: 0;
            color: #bb86fc;
        }
        button {
            background-color: #bb86fc;
            color: #121212;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #3700b3;
            color: #ffffff;
        }
        .hidden {
            display: none;
        }
        .control-group {
            margin-top: 20px;
            text-align: left;
        }
        label {
            font-size: 14px;
            color: #b0bec5;
        }
        input[type="range"], input[type="color"] {
            width: 100%;
            margin-top: 8px;
            cursor: pointer;
        }
        #status {
            font-size: 13px;
            color: #cf6679;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Smart Lamp</h2>
        
        <!-- Startbildschirm: Nur der Verbindungs-Button -->
        <div id="connectScreen">
            <p>Verbinde dich mit deiner ESP32-Lampe, um sie zu steuern.</p>
            <button id="connectBtn">Mit Lampe verbinden</button>
            <div id="status"></div>
        </div>

        <!-- Bedienbildschirm: Erst nach erfolgreicher Verbindung sichtbar -->
        <div id="controlScreen" class="hidden">
            <p style="color: #03dac6; font-size: 14px;">Status: Verbunden</p>
            
            <button id="toggleBtn" style="background-color: #03dac6;">An / Aus umschalten</button>

            <div class="control-group">
                <label for="brightnessRange">Helligkeit:</label>
                <input type="range" id="brightnessRange" min="0" max="255" value="128">
            </div>

            <div class="control-group">
                <label for="colorPicker">Farbe wählen:</label>
                <input type="color" id="colorPicker" value="#ffffff">
            </div>

            <button id="disconnectBtn" style="background-color: #cf6679; margin-top: 25px;">Trennen</button>
        </div>
    </div>

    <script>
        // Die exakten UUIDs aus deinem Arduino-Code
        const SERVICE_UUID = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
        const CHARACTERISTIC_UUID = "beb5483e-36e1-4688-b7f5-ea07361b26a8";

        let bluetoothDevice;
        let bluetoothCharacteristic;

        const connectScreen = document.getElementById('connectScreen');
        const controlScreen = document.getElementById('controlScreen');
        const connectBtn = document.getElementById('connectBtn');
        const disconnectBtn = document.getElementById('disconnectBtn');
        const toggleBtn = document.getElementById('toggleBtn');
        const brightnessRange = document.getElementById('brightnessRange');
        const colorPicker = document.getElementById('colorPicker');
        const statusDiv = document.getElementById('status');

        // Verbindungs-Button Event
        connectBtn.addEventListener('click', async () => {
            try {
                statusDiv.textContent = "Suche nach Lampe...";
                
                bluetoothDevice = await navigator.bluetooth.requestDevice({
                    filters: [{ name: 'ESP32_RGB_Lampe' }],
                    optionalServices: [SERVICE_UUID]
                });

                statusDiv.textContent = "Verbinde mit Server...";
                const server = await bluetoothDevice.gatt.connect();

                statusDiv.textContent = "Lade Service...";
                const service = await server.getPrimaryService(SERVICE_UUID);

                statusDiv.textContent = "Lade Charakteristik...";
                bluetoothCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);

                // Wenn alles geklappt hat: Wechsle den Bildschirm
                connectScreen.classList.add('hidden');
                controlScreen.classList.remove('hidden');

                // Eventlistener für Verbindungsabbruch von außen
                bluetoothDevice.addEventListener('gattserverdisconnected', onDisconnected);

            } catch (error) {
                console.error(error);
                statusDiv.textContent = "Fehler: " + error.message;
            }
        });

        // Funktion zum Senden von Daten an den ESP32
        async function sendCommand(command) {
            if (!bluetoothCharacteristic) return;
            try {
                const encoder = new TextEncoder();
                await bluetoothCharacteristic.writeValue(encoder.encode(command));
            } catch (error) {
                console.error("Fehler beim Senden:", error);
            }
        }

        // Steuerelemente-Events
        toggleBtn.addEventListener('click', () => {
            sendCommand("T");
        });

        brightnessRange.addEventListener('input', (e) => {
            sendCommand("B" + e.target.value);
        });

        colorPicker.addEventListener('input', (e) => {
            let hex = e.target.value.replace('#', '');
            let r = parseInt(hex.substring(0, 2), 16);
            let g = parseInt(hex.substring(2, 4), 16);
            let b = parseInt(hex.substring(4, 6), 16);
            sendCommand(`C${r},${g},${b}`);
        });

        // Trennen-Button
        disconnectBtn.addEventListener('click', () => {
            if (bluetoothDevice && bluetoothDevice.gatt.connected) {
                bluetoothDevice.gatt.disconnect();
            }
            resetUI();
        });

        function onDisconnected() {
            console.log("Verbindung getrennt.");
            resetUI();
        }

        function resetUI() {
            controlScreen.classList.add('hidden');
            connectScreen.classList.remove('hidden');
            statusDiv.textContent = "Verbindung getrennt.";
            bluetoothDevice = null;
            bluetoothCharacteristic = null;
        }
    </script>
</body>
</html>
