<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESP32 RGB Lampe Steuerung</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      text-align: center;
      background: #121212;
      color: #e0e0e0;
      margin: 0;
      padding: 50px 20px;
    }
    h1 {
      color: #03dac6;
      margin-bottom: 5px;
    }
    p {
      color: #aaa;
      margin-top: 0;
    }
    .card {
      background: #1e1e1e;
      padding: 30px;
      border-radius: 15px;
      display: inline-block;
      box-shadow: 0 8px 16px rgba(0,0,0,0.5);
      max-width: 400px;
      width: 100%;
    }
    .control-group {
      margin: 20px 0;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }
    input[type=color] {
      border: none;
      width: 100px;
      height: 50px;
      border-radius: 8px;
      cursor: pointer;
      background: none;
    }
    input[type=range] {
      width: 100%;
      accent-color: #03dac6;
    }
    button.power-btn {
      background: #cf6679;
      color: white;
      border: none;
      padding: 12px 25px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
      transition: background 0.2s;
    }
    button.power-btn:hover {
      background: #b5495b;
    }
    .status {
      margin-top: 15px;
      font-size: 14px;
      color: #888;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Smart Lamp</h1>
    <p>ESP32 Webinterface</p>
    
    <div class="control-group">
      <button class="power-btn" onclick="togglePower()">Ein / Aus (Toggle)</button>
    </div>

    <div class="control-group">
      <label for="colorPicker">Farbe wählen:</label>
      <input type="color" id="colorPicker" value="#ffffff" onchange="updateColor()">
    </div>

    <div class="control-group">
      <label for="brightness">Helligkeit:</label>
      <input type="range" id="brightness" min="0" max="255" value="128" oninput="updateBrightness()">
    </div>

    <div class="status" id="statusText">Status: Verbunden</div>
  </div>

  <script>
    // Trage hier die IP-Adresse deines ESP32 ein (z.B. "http://192.168.4.1")
    // Wenn die Seite direkt vom ESP32 geladen wird, kann es auch leer bleiben ("").
    const espIp = ""; 

    function sendCommand(url) {
      fetch(espIp + url)
        .then(response => {
          document.getElementById('statusText').innerText = "Status: Befehl gesendet";
        })
        .catch(error => {
          document.getElementById('statusText').innerText = "Status: Fehler bei Verbindung!";
          console.error('Fehler:', error);
        });
    }

    function togglePower() {
      sendCommand('/toggle');
    }

    function updateColor() {
      let color = document.getElementById('colorPicker').value;
      let r = parseInt(color.substr(1,2), 16);
      let g = parseInt(color.substr(3,2), 16);
      let b = parseInt(color.substr(5,2), 16);
      sendCommand(`/color?r=${r}&g=${g}&b=${b}`);
    }

    function updateBrightness() {
      let val = document.getElementById('brightness').value;
      sendCommand(`/brightness?value=${val}`);
    }
  </script>

</body>
</html>
